<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Проверка в рамке</title>
<style>body{margin:0;background:#2a2a2a;padding:16px}iframe{border:0;display:block;background:#121212}</style></head>
<body><iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search), f = document.getElementById('f');
f.style.width = (q.get('w') || 375) + 'px'; f.style.height = (q.get('h') || 812) + 'px';
f.src = q.get('src') || '../index.html?static';
</script>
</body></html>
